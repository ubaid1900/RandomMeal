<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#198754">
    <meta name="description" content="Manage your saved meals and meal categories.">
    <title>Manage Meals - Random Meal Picker</title>
    <script src="theme.js?v=__BUILD_VERSION__"></script>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <script src="meals.js?v=__BUILD_VERSION__" defer></script>
    <script src="meals-page.js?v=__BUILD_VERSION__" defer></script>
  </head>
  <body class="bg-body-tertiary">
    <main class="container py-4 py-md-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-7">
          <header class="text-center mb-4">
            <h1 class="display-5 fw-bold">Manage Meals</h1>
            <p class="text-body-secondary mb-0">Add meals and choose their categories.</p>
            <div class="d-flex justify-content-center align-items-center gap-2 mt-3">
              <a class="btn btn-outline-success" href="./">Back to meal picker</a>
              <label class="visually-hidden" for="theme-selector">Color theme</label>
              <select id="theme-selector" class="form-select w-auto" aria-label="Color theme">
                <option value="system">System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
              </select>
            </div>
          </header>

          <section class="card shadow-sm" aria-labelledby="meals-heading">
            <div class="card-body p-4">
              <h2 id="meals-heading" class="h4 mb-3">Your meals</h2>
              <form id="add-meal-form" class="row g-2 mb-3">
                <div class="col-12 col-sm-6">
                  <label class="visually-hidden" for="new-meal">New meal</label>
                  <input
                    id="new-meal"
                    class="form-control form-control-lg"
                    type="text"
                    maxlength="80"
                    placeholder="Add a meal, e.g. veggie tacos"
                    list="saved-meal-suggestions"
                    required
                  >
                  <datalist id="saved-meal-suggestions"></datalist>
                </div>
                <div class="col-12 col-sm-4">
                  <fieldset class="d-flex flex-wrap align-items-center gap-2 border rounded px-2 h-100">
                    <legend class="visually-hidden">Choose one or more meal categories</legend>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" name="new-meal-category" id="new-category-breakfast" value="breakfast">
                      <label class="form-check-label" for="new-category-breakfast">Breakfast</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" name="new-meal-category" id="new-category-lunch" value="lunch">
                      <label class="form-check-label" for="new-category-lunch">Lunch</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" name="new-meal-category" id="new-category-dinner" value="dinner" checked>
                      <label class="form-check-label" for="new-category-dinner">Dinner</label>
                    </div>
                  </fieldset>
                </div>
                <div class="col-12 col-sm-2 d-grid">
                  <button class="btn btn-outline-success btn-lg" type="submit">Add</button>
                </div>
              </form>
              <p id="meal-count" class="small text-body-secondary mb-2"></p>
              <ul id="meal-list" class="list-group" aria-label="Saved meals"></ul>
              <button id="reset-meals" class="btn btn-link btn-sm px-0 mt-3" type="button">
                Restore starter meals
              </button>
            </div>
          </section>
          <p id="storage-message" class="small text-body-secondary text-center mt-3 mb-0" aria-live="polite"></p>
        </div>
      </div>
    </main>
  </body>
</html>
