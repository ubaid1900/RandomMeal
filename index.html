<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#198754">
    <meta name="description" content="Pick a meal from your personal list of favourites.">
    <title>Random Meal Picker</title>
    <script src="theme.js?v=__BUILD_VERSION__"></script>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <script src="meals.js?v=__BUILD_VERSION__" defer></script>
    <script src="app.js?v=__BUILD_VERSION__" defer></script>
  </head>
  <body class="bg-body-tertiary">
    <main class="container py-4 py-md-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-7">
          <header class="text-center mb-4">
            <h1 class="display-5 fw-bold">Random Meal Picker</h1>
            <p class="text-body-secondary mb-0">Let your saved meals decide what's for dinner.</p>
            <div class="d-flex justify-content-center align-items-center gap-2 mt-3">
              <a class="btn btn-outline-success" href="meals.html">Manage meals</a>
              <label class="visually-hidden" for="theme-selector">Color theme</label>
              <select id="theme-selector" class="form-select w-auto" aria-label="Color theme">
                <option value="system">System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
              </select>
            </div>
          </header>

          <section class="card shadow-sm mb-4" aria-labelledby="picker-heading">
            <div class="card-body p-4 text-center">
              <h2 id="picker-heading" class="h5">What should I eat?</h2>
              <p id="meal-result" class="fs-3 fw-semibold my-4" aria-live="polite">
                Choose breakfast, lunch, or dinner.
              </p>
              <div id="category-pickers" class="d-grid gap-2 d-sm-flex" role="group" aria-label="Pick a meal by category">
                <button class="btn btn-success btn-lg flex-fill" type="button" data-category="breakfast">Breakfast</button>
                <button class="btn btn-success btn-lg flex-fill" type="button" data-category="lunch">Lunch</button>
                <button class="btn btn-success btn-lg flex-fill" type="button" data-category="dinner">Dinner</button>
              </div>
            </div>
          </section>

          <p id="storage-message" class="small text-body-secondary text-center mt-3 mb-0"></p>
        </div>
      </div>
    </main>
  </body>
</html>
